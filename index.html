    <style>
        body {
            margin: 0;

            font-family: "Times New Roman", serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #4b0082;
            margin-bottom: 25px;
        }

        .activities {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .card {
            width: 140px;
            height: 90px;
            background-color: white;
            border-radius: 10px;
            border: 2px solid #4b0082;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
            color: #4b0082;
            font-size: 20px;
            font-weight: bold;

            transition: 0.2s;
        }

        .card:hover {
            background-color: #4b0082;
            color: white;
            transform: translateY(-3px);
        }
    </style>
</head>
