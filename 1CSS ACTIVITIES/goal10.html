<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal 10</title>

    <style>
        body {
            margin: 20px;
            padding: 25px 25px 0 25px;
            background-color: #f1f1f1;
            font-family: "Times New Roman", serif;
        }

        h1 {
            font-size: 40px;
            font-weight: 550;
            margin: 0 0 28px 0;
            line-height: 0.9;
            color: black;
            letter-spacing: -2px;
        }

        .block {
            width: 240px;
            height: 220px;
            margin-bottom: 18px;
            padding: 5px;
            box-sizing: border-box;

            color: white;
            font-size: 15px;
            font-weight: 500;

            display: block;
            text-align: left;
            line-height: 1;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }
    </style>
</head>

<body>

    <h1>CSS Display Property</h1>

    <div class="block red">Red Paragraph</div>

    <div class="block green">Green Paragraph</div>

    <div class="block blue">Blue Paragraph</div>

</body>
</html>
