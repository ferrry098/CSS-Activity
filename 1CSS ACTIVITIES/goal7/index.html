<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Goal 7</title>
  
</head>
<style>
      body {
          font-family: "Times New Roman", serif;
          margin: 45px 15px;
      }
      
      h1 {
          color: blueviolet;
          font-size: 64px;
          margin-bottom: 45px;
      }
      
      h2 {
          color: blueviolet;
          font-size: 48px;
          margin-bottom: 40px;
      }
      
      .box .done {
          color: brown;
          font-size: 30px;
      }
      
      .list {
          margin-top: 25px;
          margin-left:20px;
      }
      
      .list li {
          font-size: 30px;
      }
      
      .list li:first-child {
          color: blue;
      }
      
      .list li.done {
          color: green;
      }
      
      body > ul:not(.list) {
          margin-top: 30px;
      }
      
      body > ul p.done {
          font-size: 16px;
          margin-left:20px;
      }
      
      body > p {
          font-size: 30px;
          margin-top: 35px;
          
      }
</style>

<!-- Don't change any of the HTML code! -->

<body>  
  <h1>To Do List</h1>
  <h2>Monday</h2>
  <div class="box">
    <p class="done">Do these things today!</p>
    <ul class="list">
      <li>Wash Clothes</li>
      <li class="done">Read</li>
      <li class="done">Maths Questions</li>
    </ul>
  </div>

  <ul>
    <p class="done">Other items</p>
  </ul>
  <p>The best preparation for tomorrow is doing your best today.</p>

</body>
</html>
