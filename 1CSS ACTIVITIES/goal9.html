<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal 10</title>

    <style>
        body {
            margin: 0;
            padding: 10px 0 0 0;
            background-color: white;
            font-family: "Times New Roman", serif;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 28px 0;
            font-weight: bold;
            color: black;
        }

        .block {
            width: 150px;
            height: 152px;
            padding: 3px 0 0 2px;
            box-sizing: border-box;

            color: white;
            font-size: 13px;
            display: inline-block;
            vertical-align: top;

            margin-right: 2px;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }
    </style>
</head>

<body>

    <h1>CSS Display Property</h1>

    <div class="block red">Red Paragraph</div>
    <div class="block green">Green Paragraph</div>
    <div class="block blue">Blue Paragraph</div>

</body>
</html>
